[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator-trading-bot"
version = "2.0.0"
description = "A LangGraph financial-trading orchestrator with six deterministic guardrails."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph>=1.0,<2.0",
  "langchain-core>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "pydantic>=2.10,<3.0",
  "langsmith>=0.4,<1.0",
  "python-dotenv>=1.0,<2.0",
  "tiktoken>=0.8,<1.0",
  "streamlit>=1.60,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[tool.setuptools]
py-modules = ["contract", "main_system"]
packages = [
  "app",
  "app.components",
  "app.services",
  "orchestrator",
  "orchestrator.nodes",
  "orchestrator.guardrails",
  "orchestrator.tools",
  "orchestrator.utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88
